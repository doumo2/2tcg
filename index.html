<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>2LMCard</title>
    <!-- 縦画面のゲーム。ノッチ部分まで使い、拡大は禁止 -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
    <meta name="theme-color" content="#3B6AA8">
    <!-- iOS: ホーム画面に追加した時にアプリのように全画面で開く -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="2LMCard">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="TemplateData/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="TemplateData/icons/icon-192.png">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="600" height="960" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-title">2LMCard</div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
            <div id="unity-loading-text">読み込み中...</div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js", { updateViaCache: "none" }).then(function (reg) {
            // 新しいビルドを公開した時: 取得できたら「更新」のお知らせを出す(押すと読み込み直す。勝手には読み込み直さない: 遊んでいる途中で、タイトルに戻らないように)
            reg.addEventListener("updatefound", function () {
              var w = reg.installing;
              if (!w) return;
              w.addEventListener("statechange", function () {
                if (w.state === "installed" && navigator.serviceWorker.controller) showUpdateBanner();
              });
            });
            // ホーム画面のアプリは、開きっぱなしのことが多く、ブラウザが更新を確かめにいかない。前に戻ってきた時と、一定時間ごとに、確かめる
            function check() { try { reg.update(); } catch (e) { } }
            document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
            setInterval(check, 30 * 60 * 1000);
            check();
          }).catch(function (e) { console.warn("[PWA] ServiceWorker 登録失敗", e); });
        }
      });

      function showUpdateBanner() {
        if (document.getElementById("update-banner")) return;
        var b = document.createElement("div");
        b.id = "update-banner";
        b.style.cssText = "position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;" +
          "background:#1f2a3d;color:#fff;font-family:sans-serif;font-size:16px;padding:12px 16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center";
        b.innerHTML = "<span>新しいバージョンがあります</span>";
        var btn = document.createElement("button");
        btn.textContent = "更新する";
        btn.style.cssText = "font-size:16px;padding:8px 16px;border:0;border-radius:8px;background:#e6335a;color:#fff";
        btn.onclick = function () { location.reload(); };
        b.appendChild(btn);
        document.body.appendChild(b);
      }

      // ホーム画面へ移動して戻ると、ブラウザが画面(WebGL)の描画を失うことがある(iPhone など)。
      // 失っていない時は何もしない(読み込み直すと、タイトル画面に戻ってしまうため)。
      // 失っていても、すぐには読み込み直さず、ブラウザが描画を戻してくれるのを少し待つ。戻らなかった時だけ読み込み直す。
      (function () {
        function lost() {
          try {
            var c = document.querySelector("#unity-canvas");
            var gl = c && (c.getContext("webgl2") || c.getContext("webgl"));
            return !!(gl && gl.isContextLost());
          } catch (e) { return false; }
        }
        var waiting = false;
        function recoverIfLost() {
          if (waiting || document.hidden || !lost()) return;
          waiting = true;
          setTimeout(function () {
            waiting = false;
            if (!document.hidden && lost()) location.reload();       // 待っても戻らなかった
          }, 3000);
        }
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) setTimeout(recoverIfLost, 400);
        });
        window.addEventListener("pageshow", function () {
          setTimeout(recoverIfLost, 400);                           // 一時停止していたページの復元(バックフォワードキャッシュ)。描画が生きていれば、そのまま続ける
        });
        window.addEventListener("load", function () {
          var c = document.querySelector("#unity-canvas");
          if (c) c.addEventListener("webglcontextlost", function (ev) {
            ev.preventDefault();                                    // ブラウザが描画を戻せるようにする
            setTimeout(recoverIfLost, 400);
          });
        });
      })();

      // 画面の高さを固定する。Android でキーボードを出すと、ブラウザの表示領域(高さ)が縮み、
      // ゲーム画面の縦横比が変わってUIが崩れる。キーボードで高さだけが縮んだ時は、直前の高さのままにする。
      (function () {
        var root = document.documentElement;
        var stableW = 0, stableH = 0;
        function typing() {
          var a = document.activeElement;
          var tag = a && a.tagName;
          return (window.__webInput && window.__webInput.state === 1) || tag === "INPUT" || tag === "TEXTAREA";
        }
        function update() {
          var w = window.innerWidth, h = window.innerHeight;
          var keyboard = stableH > 0 && w === stableW && h < stableH * 0.85 && typing();
          if (!keyboard) { stableW = w; stableH = h; }
          root.style.setProperty("--app-h", stableH + "px");
        }
        window.addEventListener("resize", update);
        window.addEventListener("orientationchange", function () { stableH = 0; setTimeout(update, 300); });
        update();
      })();

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingContainer = document.querySelector("#unity-loading-container");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/13e94cce22fd3a90067a397b7b5350e9.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/7faa155274e2cde20dbd20c2322db31e.data",
        frameworkUrl: buildUrl + "/3f39fc3f94da057f6680dd8926b297d8.framework.js",
        codeUrl: buildUrl + "/1291ac238764a96ef5de3f270a2ea12b.wasm",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "2LMCard.com",
        productName: "2LMCard",
        productVersion: "0.3.16",
        showBanner: unityShowBanner,
        // グラフィック設定(Low / Medium / High)で決めた、画面の細かさの上限。スマホは細かすぎて電池を使うため、下げられるようにしている。
        // 保存が無い(初めて)ときは、タッチ操作の端末は 1.5 まで、それ以外は端末の値のまま。
        devicePixelRatio: (function () {
          var native = window.devicePixelRatio || 1;
          var max = NaN;
          try { max = parseFloat(localStorage.getItem("CardGame.Dpr")); } catch (e) { }
          if (isNaN(max)) max = ("ontouchstart" in window) ? 1.5 : 0;
          return max > 0 ? Math.min(native, max) : native;
        })(),
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // iOS の拡大(ピンチ・ダブルタップ)や、長押しメニューを止める
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
        document.addEventListener(n, function (e) { e.preventDefault(); });
      });
      // 長押しメニューは止めるが、入力欄では出す(「貼り付け」のメニューに必要)
      document.addEventListener("contextmenu", function (e) {
        var t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
        e.preventDefault();
      });



      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
